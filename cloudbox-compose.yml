version: '3.8'

services: key block
  tradexpress-platform:
    build:
      context: .
      dockerfile: Cloudboxfile
    container_name: kenwell-tx-unified-cluster
    restart: always
    ports:
      - "3000:3000" # Express Ingestion Database Port Engine Mapping
      - "8000:8000" # Python Proxy AI Gateway Communication Route
    volumes:
      # Map database variables persistently to disk to safeguard snapshots
      - ./database.db:/usr/src/app/database.db
      - ./backups:/usr/src/app/backups
    environment:
      - NODE_ENV=production
      - SERVER_TARGET_HOST=192.168.100.11

