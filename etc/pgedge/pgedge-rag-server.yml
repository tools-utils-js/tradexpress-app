server:
  listen_address: "0.0.0.0"
  port: 8080

pipelines:
  - name: "tradexpress-docs"
    description: "Search my documentation"
    database:
      host: "localhost"
      port: 5432
      database: "txdb"
    tables:
      - table: "documents"
        text_column: "content"
        vector_column: "embedding"
    embedding_llm:
      provider: "openai"
      model: "text-embedding-3-small"
    rag_llm:
      provider: "anthropic"
      model: "claude-sonnet-4-20250514"
